<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; max-width: 360px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1976d2; margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #1976d2; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #errorMsg { color: #c0392b; font-size: 13px; text-align: center; min-height: 18px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Admin Login</h2>
    <p id="errorMsg"></p>
    <!-- 🔥 Changed from email to tel for mobile number input -->
    <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" autocomplete="username" maxlength="10">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="login()">Sign In</button>
</div>

<script>
    const client = window.supabase.createClient(window.SITE_CONFIG.SUPABASE_URL, window.SITE_CONFIG.SUPABASE_KEY);

    // If already logged in, skip straight to the panel this login was requested for.
    const returnTo = new URLSearchParams(window.location.search).get("returnTo") || "admin.html";
    client.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = returnTo;
    });

    async function login() {
        const mobile = document.getElementById("mobile").value.trim();
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");
        const loginBtn = document.getElementById("loginBtn");

        errorMsg.textContent = "";
        
        // 🔥 Basic Validation
        if (!mobile || !password) {
            errorMsg.textContent = "Enter your mobile number and password.";
            return;
        }

        // 🔥 Mobile Number 10-digit Validation
        if (mobile.length !== 10 || isNaN(mobile)) {
            errorMsg.textContent = "Please enter a valid 10-digit mobile number.";
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        // 🚀 SMART JUGAAD: Convert Mobile to Fake Email
        const fakeEmail = mobile + "@msshop.com";

        // 👇 DEBUGGING KE LIYE NAYI LINES 👇
        console.log("------------------------------------");
        console.log("Checking Login Details:");
        console.log("Sending Email to Supabase: ", fakeEmail);
        console.log("Password Length: ", password.length);
        console.log("------------------------------------");
        // 👆 DEBUGGING END 👆

        // Supabase Call using the fake email
        const { error } = await client.auth.signInWithPassword({ 
            email: fakeEmail, 
            password: password 
        });

        if (error) {
            // Error message clean up for user
            console.error("Supabase Error Details: ", error); // Console me exact error dikhayega
            errorMsg.textContent = "Login failed: Incorrect Number or Password";
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In";
            return;
        }

        window.location.href = returnTo;
    }

    document.getElementById("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
    });
</script>
</body>
</html>
